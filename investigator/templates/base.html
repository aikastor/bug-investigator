<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Investigations{% endblock %} · Bug Investigator</title>
<style>
:root { color-scheme: light; font: 16px/1.55 Inter, system-ui, sans-serif; color: #202c33; background: #f7f8f6; }
* { box-sizing: border-box; }
body { margin: 0; }
main, nav { max-width: 54rem; margin: auto; padding: 1rem clamp(1rem,4vw,3rem); }
nav { border-bottom: 1px solid #cdd5cf; display: flex; align-items: center; justify-content: space-between; }
nav a { font-weight: 650; }
a, summary { color: #17554a; }
h1 { font: 550 clamp(1.9rem,4vw,2.7rem)/1.12 Georgia,serif; margin: .5rem 0 1rem; overflow-wrap: anywhere; }
h2 { font-size: 1.14rem; margin: 1.6rem 0 .4rem; }
p { margin: .4rem 0 .7rem; overflow-wrap: anywhere; }
.meta { color: #475c54; font-size: .88rem; }
.finding { background: white; border-left: 4px solid #36816b; padding: .9rem 1.2rem; margin: 1.5rem 0; }
.finding h2:first-child { margin-top: 0; }
code, pre { font-family: "IBM Plex Mono",ui-monospace,monospace; font-size: .87rem; }
details { border-top: 1px solid #d2dad4; padding: .75rem 0; }
summary { cursor: pointer; overflow-wrap: anywhere; }
pre,.source { background: #edf1ed; padding: .8rem; border-radius: .3rem; }
pre, code { white-space: pre-wrap; overflow-wrap: anywhere; }
.source div { display: grid; grid-template-columns: 3.25rem minmax(0,1fr); }
.num { color: #54655e; text-align: right; padding-right: 1rem; font-variant-numeric: tabular-nums; }
.source .gap { margin-top: .8rem; }
.list { list-style: none; padding: 0; }
.list li { border-top: 1px solid #d2dad4; padding: 1rem 0; }
.tools { padding-left: 1.5rem; }
.comparison { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,15rem),1fr)); gap: 1rem; }
dt { font-weight: 600; }
dd { margin: 0 0 .5rem; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .35rem; border-bottom: 1px solid #cdd5cf; }
caption { text-align: left; font-weight: 650; margin-top: 1rem; }
footer { margin: 1.5rem 0; }
</style>
</head>
<body>
<nav><a href="/investigations">Bug Investigator</a><a href="/docs">API docs</a></nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
